sync_to_monitor yes
repaint_delay 10
input_delay 3

# Font
# font_family FiraCode Nerd Font Mono
# BEGIN_KITTY_FONTS
# font_family      family="JetBrainsMono Nerd Font Mono"
font_family      family="FiraCode Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 18.0
# END_KITTY_FONTS
adjust_line_height 135%
editor  /opt/homebrew/bin/nvim

# Window settings
remember_window_size  yes
initial_window_width  640
initial_window_height 400
remember_window_position no
window_border_width 25px
draw_minimal_borders yes

hide_window_decorations yes
confirm_os_window_close 1
remember_window_size yes
macos_titlebar_color background
macos_show_window_title_in menubar
macos_option_as_alt left
macos_colorspace displayp3

# Tab bar
tab_bar_margin_height 0.0 0.0
tab_bar_margin_width 0.0
tab_bar_edge top
tab_bar_min_tabs 1
# tab_title_template "󰺕 {sup.index} {title}"
tab_title_template "󰺕 {sup.index}"
# active_tab_title_template "{fmt.fg.orange}  {fmt.fg.tab}{title}"
active_tab_title_template "{fmt.fg.orange}  {fmt.fg.tab}{title}"
tab_powerline_style slanted
tab_bar_style powerline

# Cursor
# Hình dạng con trỏ (Block/Beam/Underline). Block là phổ biến nhất.
cursor_shape block

# Vệt theo sau (Cursor Trail)
# Đây là phần quan trọng nhất tạo ra sự "mượt mà"
# Đặt giá trị lớn hơn sẽ làm vệt con trỏ kéo dài và rõ ràng hơn.

# 1. Độ dài của vệt (thời gian tính bằng giây)
# Đặt là 1 để vệt kéo dài một cách mượt mà và rõ rệt. (số nguyên dương)
cursor_trail 1

# 2. Ngưỡng bắt đầu (Start Threshold)
# Độ trễ (tính bằng giây) trước khi vệt bắt đầu mờ dần.
# Đặt giá trị nhỏ (ví dụ 0.1) để vệt bắt đầu ngay sau khi di chuyển.
cursor_trail_start_threshold 1

# 3. Sự phân rã của vệt (Decay)
# Hai giá trị: [Thời gian phân rã tối thiểu] [Thời gian phân rã tối đa] (tính bằng giây).
# Đặt 0.2 0.6 để đảm bảo vệt tan biến chậm và trông mượt mà hơn.
cursor_trail_decay 0.1 0.4


# --- Cài đặt bổ sung ---

# Ẩn con trỏ chuột sau khi không sử dụng (đặt -1 để không bao giờ ẩn)
# Giữ -1 để con trỏ chuột luôn hiển thị, không ảnh hưởng đến con trỏ văn bản.
mouse_hide_wait -1

# Vô hiệu hóa nhấp nháy để tránh xung đột với hiệu ứng vệt (khuyến nghị)
# Bạn có thể thử các giá trị cũ, nhưng thường tắt hẳn sẽ mượt hơn khi có trail.
cursor_blink_interval 0
cursor_stop_blinking_after 0

# Behavior
copy_on_select true
resize_in_steps no
strip_trailing_spaces smart
underline_hyperlinks always
undercurl_style thin-dense

# Font tweaks
modify_font underline_position 9
modify_font underline_thickness 150%
modify_font strikethrough_position 2px

# Shortcuts
map cmd+alt+right next_tab
map cmd+alt+left previous_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7

map cmd+t launch --type=tab --cwd=current
# Colorscheme: Kanagawa
background #1F1828
foreground #DCD7BA
selection_background #2D4F67
selection_foreground #C8C093
url_color #72A7BC
cursor #C8C093

# Tabs
active_tab_background #1F1F28
active_tab_foreground #C8C093
inactive_tab_background #1F1F28
inactive_tab_foreground #727169

# Colors
color0 #16161D
color1 #C34043
color2 #76946A
color3 #C0A36E
color4 #485E81
color5 #957FB8
color6 #6A9589
color7 #C8C093
color8  #727169
color9  #E82424
color10 #98BB6C
color11 #E6C384
color12 #7FB4CA
color13 #938AA9
color14 #7AA89F
color15 #DCD7BA
color16 #FFA066
color17 #FF5D62


-- interact neovim 
# map cmd+s send_text all "\x1b:w\r"
# map cmd+q send_text all "\x1b:q\r"
# map cmd+c send_text all "\x03"
map cmd+v paste_from_clipboard

# Split vertically with custom size
map ctrl+shift+v split_window vertical 0.5
# Chia cửa sổ theo chiều ngang
map ctrl+shift+h split_window horizontal

# Map Command thành trl
# map cmd+c copy
# map cmd+v paster
# map cmd+[ send_text all \x1b

# Hoặc remap toàn bộ phím Cmd → Ctrl
macos_option_as_alt yes

# set background_image_layout o cuoi file
background_image /Users/phap/Pictures/bg.jpg
background_image_layout scaled
background_opacity 1
background_blur 1
# dynamic_background_opacity no 
background_tint 0.96

